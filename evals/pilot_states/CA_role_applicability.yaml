method_note: AEC and legal-analysis relevance is always true under current governance (Agent_Instructions.v6.md
  §6 authorizes a governed N/A only for the agency and procurement roles; Workstream 5's proposed AEC/legal no-material-impact
  values are not yet authorized and are NOT applied here). agency_process_relevant / procurement_relevant are false
  exactly where the register already uses the governed N/A string for that role -- this file is a deterministic
  restatement of the live register, not new interpretation, and exists so a future role-applicability regression
  (a record silently gaining or losing a governed N/A) is machine-detectable via evals/run_fixture_checks.py.
