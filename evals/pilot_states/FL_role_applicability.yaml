state: Florida
state_abbr: FL
method_note: Generated by scripts/route_interpretation_roles.py from the live source register's objective fields
  only (never the interpretation fields), per Workstream 5 of the improvement plan. agency_process_relevant and
  procurement_relevant are calibrated against this state's real governed-N/A decisions (98%/100% agreement across
  all five pilot states combined -- see the script's --calibrate output; the one known disagreement is WA-004, documented
  in the script's module docstring). aec_relevant and legal_analysis_relevant have no prior ground truth to calibrate
  against, since Agent_Instructions.v6.md only authorized a governed AEC/legal no-impact value at 6.4.0 -- they
  default true and are false only for informational/debunked/negative-finding records with no operative requirement.
  This file documents what routing recommends; it does NOT retroactively change any already-published interpretation
  field in the source register. run_fixture_checks.py re-derives it from the live register on every run and fails
  if either the router's code or the register drifts without this file being regenerated.
