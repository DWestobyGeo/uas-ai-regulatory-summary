name: Site quality

on:
  push:
    paths:
      - "docs/**"
      - "States/**"
      - "agents/**"
      - "methodologies/**"
      - "evals/**"
      - "runs/**"
      - "Agent_Instructions.v6.md"
      - "scripts/**"
      - "build_data.py"
      - "README.md"
      - ".github/workflows/site-quality.yml"
  pull_request:
    paths:
      - "docs/**"
      - "States/**"
      - "agents/**"
      - "methodologies/**"
      - "evals/**"
      - "runs/**"
      - "Agent_Instructions.v6.md"
      - "scripts/**"
      - "build_data.py"
      - "README.md"
      - ".github/workflows/site-quality.yml"

permissions:
  contents: read

jobs:
  validate-shared-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Validate agent-role governance
        run: python scripts/validate_roles.py

      - name: Validate comparative methodologies
        run: python scripts/validate_methodologies.py

      - name: Validate nationwide Phase 2 completion
        run: python scripts/validate_phase2.py

      - name: Validate state research manifests (pilot states)
        run: python scripts/validate_research_manifests.py

      - name: Validate research semantics
        run: python scripts/validate_research_semantics.py

      - name: Run eval fixture checks
        run: python evals/run_fixture_checks.py

      - name: Validate shared design and state data
        run: python scripts/validate_site.py

      - name: Validate generated summaries match register + authored templates
        run: python scripts/validate_generated_summary.py

      - name: Run URL-health checker request-logic fixture check (localhost only, no real internet)
        run: python evals/run_url_health_fixture_check.py
