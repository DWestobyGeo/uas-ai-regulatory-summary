    relevance_note: >-
      Reports on the Oregon Parks and Recreation Department's Rule Advisory Committee review of
      the draft "Drone Operation Areas" rule for state parks and the ocean shore -- the same
      rulemaking process that produced the OAR 736-010-0040(13) UAS Operation Areas rule OR-004
      addresses, describing the designated-zone concept, the campground/overnight-facility ban,
      and the emergency-use carve-out that all appear in the rule as finally adopted.
