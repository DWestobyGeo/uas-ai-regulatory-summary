    headline: "Flat Fire aerial tactics questioned"
    url: https://www.nuggetnews.com/story/2026/01/14/news/flat-fire-aerial-tactics-questioned/38599.html
    source_name: The Nugget Newspaper (Sisters, Oregon)
    publish_date: '2026-01-14'
    jurisdiction_match: in_state
    out_of_state_name: null
    relevance_note: >-
      Local reporting, built from the Oregon Department of Forestry's own minute-by-minute
      incident log, that a recreational drone spotted at 5:01 p.m. over the August 21, 2025
      Flat Fire near Sisters forced ODF to hold all responding aircraft and clear the fire-scene
      airspace for roughly 26 minutes during the critical initial-attack window -- exactly the
      drone interference with an active wildfire-suppression effort that ORS 837.374 (OR-002)
      penalizes.
    date_accessed: '2026-08-06'
