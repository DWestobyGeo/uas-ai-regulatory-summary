    relevance_note: >-
      Relevant context for HI-007's DLNR/DOCARE unmanned aircraft systems program: reports the first
      felony arrest under Hawaii's "Duke's Law" (Act 235, 2025) for illegal hunting on private ranch
      land, and discloses that the Hawaii Department of Law Enforcement (DLE) has expanded its
      enforcement fleet with drones equipped with cameras, thermal imaging, and loudspeakers to
      locate illegal hunters -- DLNR responded jointly with DLE to this specific incident. DLE is a
      separate state agency from DLNR/DOCARE and this is not the same program authorized by Haw. Rev.
      Stat. section 199-9, but it is directly relevant evidence that Hawaii state agencies are
      actively and currently expanding UAS-based enforcement capability in the same
      conservation/natural-resource enforcement space section 199-9 addresses, using materially
      similar equipment.
